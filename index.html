<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campamento Guillermo · Manejo Agronómico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003057">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F0F4F0;
    --surface:#FFFFFF;
    --surface-alt:#EDF1E8;
    --ink:#171E1A;
    --ink-soft:#616B62;
    --ink-faint:#96A092;
    --primary:#00539F;
    --primary-dark:#003057;
    --primary-soft:#E0EDF8;
    --amber:#C68A2E;
    --amber-soft:#FBF0DC;
    --red:#C1493E;
    --red-soft:#F9E4E1;
    --line:#E3E8DE;
    --sidebar-w:220px;
    --topbar-h:58px;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 2px 12px rgba(23,30,26,0.07), 0 1px 3px rgba(23,30,26,0.04);
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}

  body{
    background: url('bg_agro_map.png') center/cover fixed no-repeat;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #appRoot{
    display:none;
    height:100vh;
    overflow:hidden;
  }
  #appRoot.visible{
    display:grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: var(--topbar-h) 1fr;
    grid-template-areas:
      "sidebar topbar"
      "sidebar content";
  }

  #sidebar{
    grid-area: sidebar;
    background: linear-gradient(180deg, #003057 0%, #00539F 100%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:20;
    box-shadow: 2px 0 12px rgba(23,30,26,0.12);
  }
  .sb-brand{
    padding:18px 18px 14px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .sb-brand img{height:32px; width:32px; border-radius:8px; flex-shrink:0;}
  .sb-brand-text{}
  .sb-brand-title{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:0.85rem;
    color:#fff;
    line-height:1.2;
  }
  .sb-brand-sub{
    font-size:0.62rem;
    color:rgba(255,255,255,0.55);
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin-top:1px;
  }
  .sb-section{
    padding:14px 14px 4px;
    font-size:0.58rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:rgba(255,255,255,0.4);
    font-family:'IBM Plex Mono',monospace;
  }
  #nav{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:4px 10px;
    overflow-y:auto;
  }
  #nav button{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.7);
    font-family:'Inter',sans-serif;
    font-size:0.82rem;
    font-weight:500;
    cursor:pointer;
    transition:all .15s;
    text-align:left;
  }
  #nav button .ic{font-size:1rem; flex-shrink:0; width:20px; text-align:center;}
  #nav button:hover{
    background:rgba(255,255,255,0.1);
    color:#fff;
  }
  #nav button.active{
    background:rgba(255,255,255,0.18);
    color:#fff;
    font-weight:700;
  }
  .sb-footer{
    padding:14px 16px;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:0.65rem;
    color:rgba(255,255,255,0.45);
  }
  .sb-footer img{height:24px; width:auto; opacity:0.7; margin-bottom:6px; display:block;}

  #topbar{
    grid-area: topbar;
    background:rgba(255,255,255,0.93);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    box-shadow:var(--shadow);
    z-index:10;
    backdrop-filter:blur(8px);
  }
  .tb-left{}
  .tb-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:1rem;
    color:var(--ink);
  }
  .tb-sub{
    font-size:0.7rem;
    color:var(--ink-faint);
    margin-top:1px;
    font-family:'IBM Plex Mono',monospace;
  }
  .tb-right{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  .profile-row{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--surface-alt);
    padding:5px 12px;
    border-radius:20px;
    font-size:0.74rem;
  }
  .logout-btn{
    background:none;border:none;color:var(--ink-faint);
    text-decoration:underline;font-size:0.74rem;cursor:pointer;
    padding:0;font-family:'Inter',sans-serif;
  }
  .sync-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#4CAF50;flex-shrink:0;
  }
  .sync-dot.off{background:var(--red);}

  #content-wrap{
    grid-area: content;
    overflow-y:auto;
    background: rgba(240,244,240,0.18);
    padding:22px 26px 32px;
  }

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
  }
  .kpi-card{
    background:rgba(255,255,255,0.96);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:0 2px 16px rgba(23,30,26,0.13), 0 1px 4px rgba(23,30,26,0.07);
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(2px);
  }
  .kpi-card::after{
    content:'';
    position:absolute;bottom:0;left:0;right:0;height:3px;
    background:var(--kpi-color,var(--primary));
    border-radius:0 0 var(--radius) var(--radius);
  }
  .kpi-label{
    font-size:0.65rem;font-weight:700;text-transform:uppercase;
    letter-spacing:0.6px;color:var(--ink-faint);margin-bottom:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .kpi-val{
    font-family:'Sora',sans-serif;font-weight:800;font-size:1.8rem;
    color:var(--kpi-color,var(--primary));line-height:1;
  }
  .kpi-sub{font-size:0.68rem;color:var(--ink-faint);margin-top:4px;}

  .card{
    background:rgba(255,255,255,0.96);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 16px rgba(23,30,26,0.13), 0 1px 4px rgba(23,30,26,0.07);
    border:1px solid var(--line);
    backdrop-filter:blur(2px);
  }
  .card h2{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:0.92rem;
    margin:0 0 14px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }

  .dash-wrap{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:16px;
    align-items:start;
  }
  .dash-col-main,.dash-col-side{min-width:0;}

  label{
    display:block;font-size:0.72rem;font-weight:600;
    color:var(--ink-soft);margin:11px 0 4px;
  }
  input,select,textarea{
    width:100%;padding:9px 11px;
    border:1.5px solid var(--line);border-radius:var(--radius-sm);
    font-family:'Inter',sans-serif;font-size:0.88rem;
    background:var(--surface-alt);color:var(--ink);transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--primary);background:#fff;
  }
  textarea{resize:vertical;min-height:52px;}
  button.primary{
    margin-top:14px;width:100%;
    background:var(--primary);color:#fff;border:none;
    padding:11px;border-radius:var(--radius-sm);
    font-weight:700;font-size:0.88rem;font-family:'Sora',sans-serif;
    cursor:pointer;transition:background .15s,transform .1s;
  }
  button.primary:active{background:var(--primary-dark);transform:scale(0.99);}
  .field-error{color:var(--red);font-size:0.74rem;margin-top:6px;display:none;}
  .field-error.show{display:block;}

  .stock-item{padding:10px 2px;border-bottom:1px solid var(--line);}
  .stock-item:last-child{border-bottom:none;}
  .stock-cat-header{
    font-family:'IBM Plex Mono',monospace;font-size:0.62rem;font-weight:600;
    text-transform:uppercase;letter-spacing:0.8px;color:var(--primary);
    margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--primary-soft);
  }
  .stock-cat-header:first-child{margin-top:0;}
  .stock-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .stock-head .nombre{font-weight:700;font-size:0.86rem;}
  .cat-edit-x{background:none;border:none;color:var(--ink-faint);font-size:0.72rem;cursor:pointer;padding:0 2px;}
  .stock-sub{font-size:0.68rem;color:var(--ink-faint);margin-top:3px;}
  .stock-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.88rem;white-space:nowrap;}
  .stock-num .unit{font-size:0.64rem;color:var(--ink-faint);font-weight:500;}
  .stock-num.neg{color:var(--red);}
  .bar-track{height:6px;background:var(--surface-alt);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .3s;}
  .bar-fill.ok{background:var(--primary);}
  .bar-fill.low{background:var(--amber);}
  .bar-fill.neg{background:var(--red);width:100%!important;}

  .hist-item{border-bottom:1px solid var(--line);padding:10px 2px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
  .hist-top .when{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--ink-faint);}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
  .tag.entrada{background:var(--primary-soft);color:var(--primary-dark);}
  .tag.salida{background:var(--red-soft);color:var(--red);}
  .hist-title{font-weight:700;font-size:0.86rem;}
  .hist-detail{font-size:0.76rem;color:var(--ink-soft);margin-top:2px;line-height:1.4;}

  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .toolbar select{background:var(--surface);flex:1;min-width:120px;}
  .subtabs{display:flex;gap:8px;margin-bottom:14px;}
  .subtabs button{
    flex:1;padding:9px;border-radius:var(--radius-sm);
    border:1.5px solid var(--primary);background:var(--surface);
    color:var(--primary);font-weight:700;font-size:0.76rem;
    font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;
  }
  .subtabs button.active{background:var(--primary);color:#fff;}

  .weed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .weed-card{border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-alt);border:1px solid var(--line);}
  .weed-card img{width:100%;height:110px;object-fit:cover;display:block;}
  .weed-card .wc-body{padding:8px 9px;}
  .wc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;}
  .wc-actions{display:flex;gap:2px;flex-shrink:0;}
  .edit-x{background:none;border:none;color:var(--ink-faint);font-size:0.82rem;cursor:pointer;padding:2px 4px;}
  .weed-card .wc-name{font-weight:700;font-size:0.8rem;}
  .weed-card .wc-date{font-size:0.62rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(23,30,26,0.45);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:400px;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);max-height:90vh;overflow-y:auto;
  }
  .modal-box h3{font-family:'Sora',sans-serif;font-size:1rem;margin:0 0 8px;}
  .modal-box p{font-size:0.85rem;color:var(--ink-soft);margin:0 0 12px;line-height:1.4;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions button{
    flex:1;padding:10px;border-radius:var(--radius-sm);border:none;
    font-weight:700;font-size:0.85rem;font-family:'Sora',sans-serif;cursor:pointer;
  }
  .modal-actions .btn-cancel{background:var(--surface-alt);color:var(--ink-soft);}
  .modal-actions .btn-ok{background:var(--primary);color:#fff;}
  .modal-actions .btn-danger{background:var(--red);color:#fff;}
  .pv-row{font-size:0.84rem;color:var(--ink);padding:6px 0;border-bottom:1px solid var(--line);text-align:left;}
  .pv-row:last-of-type{border-bottom:none;}
  .pv-row a{color:var(--primary);font-weight:600;}
  .pv-label{display:block;font-size:0.65rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:1px;}

  .toast-stack{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 16px;pointer-events:none;}
  .toast{background:var(--ink);color:#fff;font-size:0.82rem;padding:9px 16px;border-radius:var(--radius-sm);box-shadow:0 6px 20px rgba(0,0,0,0.2);max-width:420px;text-align:center;pointer-events:auto;}
  .toast.err{background:var(--red);}

  .empty{text-align:center;color:var(--ink-faint);font-size:0.84rem;padding:22px 10px;}
  .delete-x{background:none;border:none;color:var(--ink-faint);font-size:1rem;cursor:pointer;padding:2px 6px;}
  .banner{font-size:0.74rem;background:var(--amber-soft);border:1px dashed var(--amber);padding:9px 12px;border-radius:var(--radius-sm);color:#7A5A1E;margin-bottom:12px;}
  .banner-mini{font-size:0.72rem;color:var(--ink-faint);background:var(--surface-alt);padding:7px 12px;border-radius:20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .banner-mini button{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:0.8rem;padding:0 2px;flex-shrink:0;}
  .app-footer-sig{text-align:center;padding:18px 0 6px;opacity:0.75;}
  .app-footer-sig img{height:36px;width:auto;}

  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
    background: url('bg_agro_map.png') center/cover no-repeat;
  }
  .login-box{
    background:rgba(255,255,255,0.97);border-radius:var(--radius);
    box-shadow:0 8px 40px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.15);
    border:1px solid var(--line);padding:28px 24px;width:100%;max-width:360px;text-align:center;
  }
  .login-box img{width:60px;height:60px;border-radius:14px;margin-bottom:10px;}
  .login-box h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.3rem;margin:0 0 2px;color:var(--ink);}
  .login-box p{font-size:0.82rem;color:var(--ink-soft);margin:0 0 18px;}
  .login-box input{margin-bottom:10px;}
  .login-box label{text-align:left;}
  .conn-status{font-size:0.68rem;color:var(--ink-faint);margin-top:14px;font-family:'IBM Plex Mono',monospace;}

  @media(max-width:768px){
    #appRoot.visible{
      grid-template-columns:1fr;
      grid-template-rows:auto 1fr auto;
      grid-template-areas:
        "topbar"
        "content"
        "sidebar";
    }
    #topbar{
      padding:0 14px;
      min-height:48px;
      height:48px;
    }
    .tb-title{font-size:0.85rem;}
    .tb-sub{display:none;}
    .tb-right{font-size:0.68rem; gap:6px;}
    .tb-right .user-dot{display:none;}

    #sidebar{
      grid-area:sidebar;
      flex-direction:row;
      height:auto;
      overflow-x:auto;
      padding:4px 8px;
    }
    #sidebar .sb-brand,#sidebar .sb-section,#sidebar .sb-footer{display:none;}
    #nav{flex-direction:row;padding:0;gap:0;overflow-x:auto;}
    #nav button{flex-direction:column;gap:2px;padding:8px 12px;font-size:0.64rem;border-radius:8px;white-space:nowrap;}
    #nav button .ic{width:auto;}
    #content-wrap{padding:14px 12px 16px;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .dash-wrap{grid-template-columns:1fr;}
    .weed-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

<script>
const SUPABASE_URL = 'https://aljgksevggwtfndqxoiy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IEGX-ej9_w-tksybzT2Vfw_riE98P7m';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { chemicals: [], movements: [], weeds: [] };
let currentTab = 'stock';
let loadForm = 'entrada';
let currentUser = null;
let autorLabel = '';
let realtimeChannel = null;

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const fmtDate = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const todayISO = () => new Date().toISOString().slice(0,10);

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg, isError){
  const stack = $('#toastStack');
  if(!stack) return;
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(), 300); }, 2800);
}

function askConfirm(title, message, danger){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn-cancel">Cancelar</button>
          <button class="${danger ? 'btn-danger' : 'btn-ok'}">${danger ? 'Eliminar' : 'Confirmar'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.btn-cancel').onclick = ()=>{ overlay.remove(); resolve(false); };
    overlay.querySelector(danger ? '.btn-danger' : '.btn-ok').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}

async function seedInitialStock(){
  if(state.chemicals.length > 0){ showToast('Ya hay productos cargados, no hace falta.', true); return; }
  showToast('Cargando stock inicial...');
  for(const item of SEED){
    const { data, error } = await supa.from('chemicals')
      .insert({ nombre:item.nombre, unidad:item.unidad, categoria:item.categoria })
      .select().single();
    if(error){ showToast('Error creando '+item.nombre+': '+error.message, true); continue; }
    await supa.from('movements').insert({
      tipo:'entrada', fecha: todayISO(), chemical_id: data.id, cantidad: item.cantidad,
      notas: 'Carga inicial de stock desde fotos · ' + item.nota, autor: autorLabel
    });
  }
  await fetchAll();
  showToast('Stock inicial cargado ✓');
  render();
}

async function fetchChemicals(){
  const { data, error } = await supa.from('chemicals').select('*').order('nombre');
  if(error){ showToast('Error cargando productos: ' + error.message, true); return; }
  state.chemicals = data || [];
}
async function fetchMovements(){
  const { data, error } = await supa.from('movements').select('*').order('fecha', { ascending:true });
  if(error){ showToast('Error cargando movimientos: ' + error.message, true); return; }
  state.movements = (data || []).map(m => ({
    id: m.id, tipo: m.tipo, fecha: m.fecha, chemicalId: m.chemical_id,
    cantidad: m.cantidad, proveedor: m.proveedor, factura: m.factura,
    labor: m.labor, lote: m.lote, supAplicada: m.sup_aplicada, dosis: m.dosis,
    consumo: m.consumo, foto: m.foto_url, notas: m.notas, autor: m.autor, grupoId: m.grupo_id
  }));
}
async function fetchWeeds(){
  const { data, error } = await supa.from('weeds').select('*').order('fecha', { ascending:false });
  if(error){ showToast('Error cargando biblioteca: ' + error.message, true); return; }
  state.weeds = (data || []).map(w => ({
    id: w.id, nombre: w.nombre, fecha: w.fecha, foto: w.foto_url, notas: w.notas, autor: w.autor
  }));
}
async function fetchAll(){ await Promise.all([fetchChemicals(), fetchMovements(), fetchWeeds()]); }

function stockOf(chemicalId){
  let total = 0;
  state.movements.forEach(m=>{
    if(m.tipo === 'entrada' && m.chemicalId === chemicalId) total += num(m.cantidad);
    if(m.tipo === 'salida' && m.chemicalId === chemicalId) total -= num(m.consumo);
  });
  return total;
}
function maxEntradaOf(chemicalId){
  let max = 0;
  state.movements.forEach(m=>{
    if(m.tipo === 'entrada' && m.chemicalId === chemicalId) max = Math.max(max, num(m.cantidad));
  });
  return max || 1;
}
function chemicalName(id){ const c = state.chemicals.find(c=>c.id===id); return c ? c.nombre : '(producto eliminado)'; }
function chemicalUnit(id){ const c = state.chemicals.find(c=>c.id===id); return c ? c.unidad : ''; }
function chemicalCategoria(id){ const c = state.chemicals.find(c=>c.id===id); return (c && c.categoria) ? c.categoria : 'Otro'; }

async function uploadPhoto(file, folder){
  if(!file) return '';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supa.storage.from('fotos').upload(path, file, { cacheControl:'3600', upsert:false });
    if(error){ showToast('No se pudo subir la foto: ' + error.message, true); return ''; }
    const { data } = supa.storage.from('fotos').getPublicUrl(path);
    return (data && data.publicUrl) ? data.publicUrl : '';
  }catch(e){
    showToast('No se pudo subir la foto.', true);
    return '';
  }
}

async function doLogin(){
  const email = $('#login-email').value.trim();
  const pass = $('#login-pass').value;
  const errEl = $('#login-error');
  errEl.classList.remove('show'); errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Completá email y contraseña.'; errEl.classList.add('show'); return; }
  const btn = $('#login-btn');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Ingresar';
  if(error){
    errEl.textContent = 'No se pudo ingresar: revisá el email y la contraseña.';
    errEl.classList.add('show');
    return;
  }
  await onLoginSuccess(data.user);
}

async function onLoginSuccess(user){
  currentUser = user;
  autorLabel = (user.email || '').split('@')[0];
  $('#loginScreen').style.display = 'none';
  $('#appRoot').classList.add('visible'); $('#appRoot').style.display = '';
  renderProfileBadge();
  await fetchAll();
  render();
  setupRealtime();
}

async function doLogout(){
  if(realtimeChannel){ supa.removeChannel(realtimeChannel); realtimeChannel = null; }
  await supa.auth.signOut();
  currentUser = null;
  state = { chemicals: [], movements: [], weeds: [] };
  $('#appRoot').classList.remove('visible'); $('#appRoot').style.display = '';
  $('#loginScreen').style.display = 'flex';
  $('#login-email').value = '';
  $('#login-pass').value = '';
}

function renderProfileBadge(){
  const el = $('#profileRow');
  if(!el) return;
  el.innerHTML = `<span class="sync-dot" id="syncDot"></span>${escapeHtml(currentUser ? currentUser.email : '')} · <button id="logoutBtn" class="logout-btn">salir</button>`;
  const btn = $('#logoutBtn');
  if(btn) btn.onclick = doLogout;
}

function setupRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supa.channel('public:campamento-guillermo')
    .on('postgres_changes', { event:'*', schema:'public', table:'chemicals' }, async ()=>{ await fetchChemicals(); render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'movements' }, async ()=>{ await fetchMovements(); render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'weeds' }, async ()=>{ await fetchWeeds(); render(); })
    .subscribe((status)=>{
      const dot = $('#syncDot');
      if(dot) dot.classList.toggle('off', status !== 'SUBSCRIBED');
    });
}

function xlsxReady(){
  if(typeof XLSX === 'undefined'){
    showToast('No se pudo cargar la librería de Excel. Revisá tu conexión a internet e intentá de nuevo.', true);
    return false;
  }
  return true;
}

function exportStockExcel(){
  if(!xlsxReady()) return;
  const stockRows = state.chemicals.slice()
    .sort((a,b)=> (a.categoria||'Otro').localeCompare(b.categoria||'Otro') || a.nombre.localeCompare(b.nombre))
    .map(c=>({
      "Producto": c.nombre, "Categoría": c.categoria || 'Otro', "Unidad": c.unidad,
      "Stock actual": Number(stockOf(c.id).toFixed(2))
    }));
  const comprasRows = state.movements.filter(m=>m.tipo==='entrada')
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(m=>({
      "Fecha": m.fecha, "Producto": chemicalName(m.chemicalId), "Categoría": chemicalCategoria(m.chemicalId),
      "Cantidad": m.cantidad, "Unidad": chemicalUnit(m.chemicalId), "Proveedor": m.proveedor || '',
      "N° factura/remito": m.factura || '', "Cargado por": m.autor || '', "Notas": m.notas || ''
    }));
  const salidasRows = state.movements.filter(m=>m.tipo==='salida')
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(m=>({
      "Fecha": m.fecha, "Labor": m.labor, "Lote/sector": m.lote || '', "Superficie (ha)": m.supAplicada,
      "Producto": chemicalName(m.chemicalId), "Dosis/ha": m.dosis, "Unidad": chemicalUnit(m.chemicalId),
      "Consumo total": Number((m.consumo||0).toFixed(2)), "Cargado por": m.autor || '', "Notas": m.notas || '',
      "Tiene foto": m.foto ? 'Sí' : 'No'
    }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows), 'Stock actual');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(comprasRows), 'Compras');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salidasRows), 'Aplicaciones');
  XLSX.writeFile(wb, `stock_y_movimientos_campamento_guillermo_${todayISO()}.xlsx`);
  showToast('Descarga generada ✓');
}

function exportHistorialExcel(){
  if(!xlsxReady()) return;
  const salidas = state.movements.filter(m=>m.tipo==='salida').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  // asignar un número de aplicación legible a cada grupo (mismo grupo_id = misma aplicación)
  const grupoNums = {};
  let nextNum = 1;
  salidas.forEach(m=>{
    const key = m.grupoId || ('__solo__' + m.id);
    if(!grupoNums[key]) grupoNums[key] = nextNum++;
  });
  const rows = salidas.map(m=>({
      "Aplicación N°": grupoNums[m.grupoId || ('__solo__' + m.id)],
      "Fecha": m.fecha, "Labor": m.labor, "Lote/sector": m.lote || '', "Superficie (ha)": m.supAplicada,
      "Producto": chemicalName(m.chemicalId), "Categoría": chemicalCategoria(m.chemicalId),
      "Dosis/ha": m.dosis, "Unidad": chemicalUnit(m.chemicalId), "Consumo total": Number((m.consumo||0).toFixed(2)),
      "Cargado por": m.autor || '', "Notas": m.notas || '', "Tiene foto": m.foto ? 'Sí' : 'No'
    }));
  if(rows.length === 0){ showToast('Todavía no hay labores registradas para exportar.', true); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Historial de manejo');
  XLSX.writeFile(wb, `historial_de_manejo_campamento_guillermo_${todayISO()}.xlsx`);
  showToast('Descarga generada ✓');
}

function renderStock(main){
  const wrap = document.createElement('div');
  wrap.className = 'dash-wrap';
  const colMain = document.createElement('div');
  colMain.className = 'dash-col-main';
  const colSide = document.createElement('div');
  colSide.className = 'dash-col-side';
  wrap.appendChild(colMain);
  wrap.appendChild(colSide);
  main.appendChild(wrap);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>🧪 Stock vivo de químicos</h2>`;
  if(state.chemicals.length === 0){
    card.innerHTML += `<div class="empty">Todavía no hay productos cargados.<br>Andá a "Cargar → Entrada" para registrar la primera compra.</div>`;
    const seedBtn = document.createElement('button');
    seedBtn.className = 'primary';
    seedBtn.textContent = '📦 Cargar stock inicial (18 productos de las fotos)';
    seedBtn.onclick = seedInitialStock;
    card.appendChild(seedBtn);
  } else {
    const groups = {};
    state.chemicals.forEach(c=>{
      const cat = c.categoria || 'Otro';
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push(c);
    });
    CATEGORIAS.forEach(cat=>{
      if(!groups[cat] || groups[cat].length === 0) return;
      const catHeader = document.createElement('div');
      catHeader.className = 'stock-cat-header';
      catHeader.textContent = cat;
      card.appendChild(catHeader);
      groups[cat].slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(c=>{
        const s = stockOf(c.id);
        const max = Math.max(maxEntradaOf(c.id), s);
        const frac = max > 0 ? Math.min(1, Math.max(0, s/max)) : 0;
        const barClass = s < 0 ? 'neg' : (frac < 0.25 ? 'low' : 'ok');
        const div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML = `
          <div class="stock-head">
            <span class="nombre">${escapeHtml(c.nombre)} <button class="cat-edit-x" data-id="${c.id}" title="Ver ficha técnica">ℹ️</button><button class="cat-edit-x edit-chem-x" data-id="${c.id}" title="Editar ficha técnica">✏️</button></span>
            <span class="stock-num ${s<0?'neg':''}">${s.toFixed(2)} <span class="unit">${escapeHtml(c.unidad)}</span></span>
          </div>
          <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${Math.round(frac*100)}%"></div></div>
          ${c.cultivo ? `<div class="stock-sub">🌱 ${escapeHtml(c.cultivo)}</div>` : ''}
        `;
        card.appendChild(div);
      });
    });
    $$('.cat-edit-x:not(.edit-chem-x)', card).forEach(btn=>{
      btn.onclick = ()=> openProductViewModal(btn.dataset.id);
    });
    $$('.edit-chem-x', card).forEach(btn=>{
      btn.onclick = ()=> openProductEditModal(btn.dataset.id);
    });
  }
  colMain.appendChild(card);

  const laborCounts = {};
  state.movements.forEach(m=>{
    if(m.tipo === 'salida'){
      laborCounts[m.labor] = (laborCounts[m.labor] || 0) + 1;
    }
  });
  const laborEntries = Object.entries(laborCounts).sort((a,b)=>b[1]-a[1]);
  const chartCard = document.createElement('div');
  chartCard.className = 'card';
  chartCard.innerHTML = `<h2>📈 Actividad por labor <span style="font-size:0.62rem; font-weight:600; color:var(--primary); background:var(--primary-soft); padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.4px;">en vivo</span></h2>`;
  if(laborEntries.length === 0){
    chartCard.innerHTML += `<div class="empty">Todavía no hay labores registradas para graficar.</div>`;
  } else {
    const maxCount = Math.max(...laborEntries.map(e=>e[1]));
    laborEntries.forEach(([labor, count])=>{
      const pct = Math.round((count / maxCount) * 100);
      const row = document.createElement('div');
      row.className = 'stock-item';
      row.innerHTML = `
        <div class="stock-head">
          <span class="nombre">${escapeHtml(labor)}</span>
          <span class="stock-num">${count}</span>
        </div>

function chemOptionsHTML(){
  const groups = {};
  state.chemicals.forEach(c=>{
    const cat = c.categoria || 'Otro';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(c);
  });
  let html = '';
  CATEGORIAS.forEach(cat=>{
    if(!groups[cat] || groups[cat].length === 0) return;
    const items = groups[cat].slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
    html += `<optgroup label="${escapeHtml(cat)}">`;
    items.forEach(c=>{ html += `<option value="${c.id}">${escapeHtml(c.nombre)} (${escapeHtml(c.unidad)})</option>`; });
    html += `</optgroup>`;
  });
  return html;
}

    prodCount++;

    row.className = 'sp-row';
    row.dataset.rowId = rowId;
    row.style.cssText = 'border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; margin-bottom:8px; background:var(--surface-alt);';

      <input type="number" step="0.001" class="sp-dosis" placeholder="Ej: 3 (L/ha)">
    `;
    prodWrap.appendChild(row);
    row.querySelector('.sp-remove').onclick = ()=>{
      row.remove();
      updateRemoveButtons();
    };
    updateRemoveButtons();
  }
  function updateRemoveButtons(){
    const rows = $$('.sp-row', prodWrap);
    rows.forEach(r=>{
      const btn = r.querySelector('.sp-remove');
      btn.style.display = rows.length > 1 ? 'inline-block' : 'none';
    });
  }
  addProductRow();
  $('#s-add-producto').onclick = addProductRow;

  function clearErr(){ const el = $('#s-error'); el.textContent=''; el.classList.remove('show'); }

    const fecha = $('#s-fecha').value;
    const labor = $('#s-labor').value;
    const lote = $('#s-lote').value.trim();
    const sup = num($('#s-sup').value);

    if(sup <= 0){ showErr('La superficie aplicada debe ser mayor a 0.'); return; }

    const rows = $$('.sp-row', prodWrap);
    const items = [];
    for(const row of rows){
      const chemId = row.querySelector('.sp-chem').value;
      const dosis = num(row.querySelector('.sp-dosis').value);
      if(!chemId){ showErr('Elegí un producto en cada línea del caldo.'); return; }
      if(dosis <= 0){ showErr('Cada producto necesita una dosis mayor a 0.'); return; }
      items.push({ chemId, dosis, consumo: sup * dosis });
    }
    // avisar si algún producto queda con stock negativo
    for(const item of items){
      const currentStock = stockOf(item.chemId);
      if(item.consumo > currentStock){
        const ok = await askConfirm('Stock insuficiente', `Esto deja el stock de ${chemicalName(item.chemId)} en negativo (${(currentStock-item.consumo).toFixed(2)}). ¿Guardar igual?`, false);
        if(!ok) return;
      }
    }

    const btn = $('#s-save'); btn.disabled = true; btn.textContent = 'Guardando...';
    const notas = $('#s-notas').value.trim();
    const file = $('#s-foto').files[0];
    const fotoUrl = await uploadPhoto(file, 'aplicaciones');
    const grupoId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2)));
    const payload = items.map(item => ({
      tipo:'salida', fecha, labor, lote, sup_aplicada: sup, chemical_id: item.chemId,
      dosis: item.dosis, consumo: item.consumo, notas, foto_url: fotoUrl || null,
      autor: autorLabel, grupo_id: grupoId
    }));
    const { error } = await supa.from('movements').insert(payload);
    btn.disabled = false; btn.textContent = 'Guardar salida';
    if(error){ showErr('Error guardando: ' + error.message); return; }
    await fetchAll();
    showToast(items.length > 1 ? `Labor guardada ✓ (${items.length} productos)` : 'Labor guardada ✓');
    render();
  };
}

    <button class="primary" id="export-hist-btn" style="margin-bottom:14px;">📥 Descargar historial de manejo (Excel)</button>`;
  const list = document.createElement('div');
  card.appendChild(list);
  main.appendChild(card);
  $('#export-hist-btn').onclick = exportHistorialExcel;

  function draw(){
    const labor = $('#h-labor').value;
    const chem = $('#h-chem').value;
    let items = state.movements.filter(m=>{
      if(m.tipo !== 'salida') return false;
      if(labor && m.labor !== labor) return false;
      if(chem && m.chemicalId !== chem) return false;
      return true;
    });

    // agrupar por grupo_id (varios productos de una misma aplicación); las que no
    // tienen grupo_id (cargadas antes de este cambio) quedan como grupo de 1 solas
    const groupsMap = {};
    items.forEach(m=>{
      const key = m.grupoId || ('__solo__' + m.id);
      if(!groupsMap[key]) groupsMap[key] = [];
      groupsMap[key].push(m);
    });
    const groups = Object.values(groupsMap).sort((a,b)=> b[0].fecha.localeCompare(a[0].fecha));

    list.innerHTML = '';
    if(groups.length === 0){ list.innerHTML = '<div class="empty">Todavía no hay labores registradas que coincidan.</div>'; return; }
    groups.forEach(group=>{
      const first = group[0];
      const ids = group.map(m=>m.id);
      const productosHtml = group.map(m=>
        `<div class="hist-detail">🧪 ${escapeHtml(chemicalName(m.chemicalId))} · dosis ${m.dosis} ${escapeHtml(chemicalUnit(m.chemicalId))}/ha · consumo total ${m.consumo.toFixed(2)} ${escapeHtml(chemicalUnit(m.chemicalId))}</div>`
      ).join('');
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = `
        <div class="hist-top">
          <span><span class="tag salida">${escapeHtml(first.labor)}</span> <span class="when">${fmtDate(first.fecha)}</span>${group.length > 1 ? ` <span class="tag entrada" style="margin-left:4px;">${group.length} productos</span>` : ''}</span>
          <button class="delete-x" data-ids="${ids.join(',')}">✕</button>
        </div>
        <div class="hist-title">${escapeHtml(first.lote || '(sin lote)')} · ${first.supAplicada} ha</div>
        ${productosHtml}
        ${first.notas ? `<div class="hist-detail">${escapeHtml(first.notas)}</div>` : ''}
        ${first.autor ? `<div class="hist-detail">Cargado por: ${escapeHtml(first.autor)}</div>` : ''}
        ${first.foto ? `<img src="${first.foto}" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-sm);margin-top:8px;">` : ''}
      `;
      list.appendChild(div);
    });

    $$('.delete-x', list).forEach(btn=>{
      btn.onclick = async ()=>{
        const idsToDelete = btn.dataset.ids.split(',');
        const msg = idsToDelete.length > 1
          ? `¿Eliminar esta labor y sus ${idsToDelete.length} productos? Esto va a recalcular el stock.`
          : '¿Eliminar esta labor? Esto va a recalcular el stock.';
        const ok = await askConfirm('Eliminar labor', msg, true);
        if(ok){
          const { error } = await supa.from('movements').delete().in('id', idsToDelete);
          if(error){ showToast('Error: '+error.message, true); return; }
          await fetchMovements();
          draw();
        }
      };
    });
  }
  $('#h-labor').onchange = draw;
  $('#h-chem').onchange = draw;
  draw();
}

async function migrateLocalWeeds(){
  let raw = null;
  try{ raw = localStorage.getItem('campamento-guillermo-agro-v1'); }catch(e){}
  if(!raw){ showToast('No se encontraron datos guardados en este navegador.', true); return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ showToast('Los datos locales de este navegador no se pudieron leer.', true); return; }
  const weeds = (parsed && Array.isArray(parsed.weeds)) ? parsed.weeds : [];
  if(weeds.length === 0){ showToast('No había fichas de biblioteca guardadas en este navegador.', true); return; }
  const conFoto = weeds.filter(w=>w.foto).length;
  const ok = await askConfirm(
    'Recuperar fichas de este navegador',
    `Se encontraron ${weeds.length} fichas guardadas acá (${conFoto} con foto). ¿Migrarlas a la base compartida de Supabase?`,
    false
  );
  if(!ok) return;
  showToast('Migrando fichas, puede tardar un poco...');
  let count = 0;
  for(const w of weeds){
    let fotoUrl = '';
    if(w.foto && typeof w.foto === 'string' && w.foto.startsWith('data:')){
      try{
        const blob = await (await fetch(w.foto)).blob();
        const ext = (blob.type.split('/')[1] || 'jpg').replace(/[^a-z0-9]/g,'') || 'jpg';
        const path = `malezas/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        const { error: upErr } = await supa.storage.from('fotos').upload(path, blob, { cacheControl:'3600', upsert:false });
        if(!upErr){
          const { data } = supa.storage.from('fotos').getPublicUrl(path);
          fotoUrl = (data && data.publicUrl) ? data.publicUrl : '';
        }
      }catch(e){ /* si falla la foto, igual migramos el texto de la ficha */ }
    }
    const { error } = await supa.from('weeds').insert({
      nombre: w.nombre || 'Sin nombre', fecha: w.fecha || todayISO(),
      foto_url: fotoUrl || null, notas: w.notas || '', autor: autorLabel
    });
    if(!error) count++;
  }
  await fetchWeeds();
  showToast(`${count} de ${weeds.length} fichas migradas ✓`);
  render();
}

function renderBiblioteca(main){
  const migrateCard = document.createElement('div');
  migrateCard.className = 'card';
  migrateCard.innerHTML = `
    <h2>♻️ Recuperar fichas de este navegador</h2>
    <div class="hist-detail" style="margin-bottom:8px;">Si en este mismo navegador ya habías cargado fichas con fotos antes de pasar a Supabase, tocá este botón para subirlas a la base compartida. Solo hace falta hacerlo una vez por dispositivo.</div>
    <button class="primary" id="migrate-local-btn">Buscar y migrar fichas de este navegador</button>
  `;
  main.appendChild(migrateCard);
  $('#migrate-local-btn').onclick = migrateLocalWeeds;

  const importCard = document.createElement('div');
  importCard.className = 'card';
  importCard.innerHTML = `
    <h2>📥 Importar base de consulta</h2>
    <div class="hist-detail" style="margin-bottom:8px;">Cargá un archivo .json con fichas (nombre + notas) y se agregan todas juntas a la biblioteca. Después les podés sumar fotos entrando a cada una manualmente si querés.</div>
    <input type="file" id="w-import" accept=".json,application/json">
    <div class="field-error" id="w-import-error"></div>
    <button class="primary" id="w-import-btn">Importar</button>
  `;
  main.appendChild(importCard);

  function showImportErr(msg){ const el = $('#w-import-error'); el.textContent = msg; el.classList.add('show'); }
  function clearImportErr(){ const el = $('#w-import-error'); el.textContent=''; el.classList.remove('show'); }

  $('#w-import-btn').onclick = ()=>{
    clearImportErr();
    const file = $('#w-import').files[0];
    if(!file){ showImportErr('Elegí primero un archivo .json.'); return; }
    const reader = new FileReader();
    reader.onload = async ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ showImportErr('El archivo no es un JSON válido.'); return; }
      if(!Array.isArray(data)){ showImportErr('El JSON debe ser una lista de fichas.'); return; }
      const rows = data.filter(item => item && typeof item.nombre === 'string' && item.nombre.trim())
        .map(item => ({
          nombre: item.nombre.trim(), fecha: todayISO(),
          notas: (item.notas || '').trim(), autor: autorLabel
        }));
      if(rows.length === 0){ showImportErr('No se encontraron fichas válidas en el archivo.'); return; }
      const { error } = await supa.from('weeds').insert(rows);
      if(error){ showImportErr('Error importando: ' + error.message); return; }
      await fetchWeeds();
      showToast(`${rows.length} fichas importadas ✓`);
      render();
    };
    reader.onerror = ()=> showImportErr('No se pudo leer el archivo.');
    reader.readAsText(file);
  };

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>🌿 Cargar ficha de maleza / consulta</h2>
    <label>Nombre</label>
    <input id="w-nombre" placeholder="Ej: Rama negra (Conyza spp.)">
    <label>Foto (opcional)</label>
    <input type="file" id="w-foto" accept="image/*">
    <label>Notas (control, estado, observaciones)</label>
    <textarea id="w-notas"></textarea>
    <div class="field-error" id="w-error"></div>
    <button class="primary" id="w-save">Guardar ficha</button>
  `;
  main.appendChild(card);

  function showErr(msg){ const el = $('#w-error'); el.textContent = msg; el.classList.add('show'); }
  function clearErr(){ const el = $('#w-error'); el.textContent=''; el.classList.remove('show'); }

  $('#w-save').onclick = async ()=>{
    clearErr();
    const nombre = $('#w-nombre').value.trim();
    if(!nombre){ showErr('Poné un nombre.'); return; }
    const btn = $('#w-save'); btn.disabled = true; btn.textContent = 'Guardando...';
    const file = $('#w-foto').files[0];
    const fotoUrl = await uploadPhoto(file, 'malezas');
    const { error } = await supa.from('weeds').insert({
      nombre, fecha: todayISO(), foto_url: fotoUrl || null, notas: $('#w-notas').value.trim(), autor: autorLabel
    });
    btn.disabled = false; btn.textContent = 'Guardar ficha';
    if(error){ showErr('Error guardando: ' + error.message); return; }
    await fetchWeeds();
    showToast('Ficha guardada ✓');
    render();
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.innerHTML = '<h2>Biblioteca</h2>';
  if(state.weeds.length > 0){
    const searchWrap = document.createElement('div');
    searchWrap.innerHTML = `<input type="text" id="w-search" placeholder="Buscar por nombre o notas...">`;
    listCard.appendChild(searchWrap);
  }
  const gridContainer = document.createElement('div');
  listCard.appendChild(gridContainer);

  function normalize(str){
    return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function drawGrid(){
    if(state.weeds.length === 0){
      gridContainer.innerHTML = '<div class="empty">Todavía no hay fichas cargadas.</div>';
      return;
    }
    const searchEl = $('#w-search');
    const q = normalize(searchEl ? searchEl.value : '');
    const filtered = state.weeds.filter(w => !q || normalize(w.nombre).includes(q) || normalize(w.notas).includes(q));
    gridContainer.innerHTML = '';
    if(filtered.length === 0){
      gridContainer.innerHTML = '<div class="empty">No hay fichas que coincidan con la búsqueda.</div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'weed-grid';
    filtered.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(w=>{
      const div = document.createElement('div');
      div.className = 'weed-card';
      div.innerHTML = `
        ${w.foto ? `<img src="${w.foto}" alt="${escapeHtml(w.nombre)}">` : `<div style="height:112px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:0.7rem;">sin foto</div>`}
        <div class="wc-body">
          <div class="wc-top">
            <div class="wc-name">${escapeHtml(w.nombre)}</div>
            <div class="wc-actions">
              <button class="edit-x" data-id="${w.id}" title="Editar">✏️</button>
              <button class="delete-x" data-id="${w.id}">✕</button>
            </div>
          </div>
          <div class="wc-date">${fmtDate(w.fecha)}</div>
          ${w.notas ? `<div class="hist-detail">${escapeHtml(w.notas)}</div>` : ''}
        </div>
      `;
      grid.appendChild(div);
    });
    gridContainer.appendChild(grid);
    $$('.delete-x', grid).forEach(btn=>{
      btn.onclick = async ()=>{
        const ok = await askConfirm('Eliminar ficha', '¿Eliminar esta ficha de la biblioteca?', true);
        if(ok){
          const { error } = await supa.from('weeds').delete().eq('id', btn.dataset.id);
          if(error){ showToast('Error: '+error.message, true); return; }
          await fetchWeeds();
          drawGrid();
        }
      };
    });
    $$('.edit-x', grid).forEach(btn=>{
      btn.onclick = ()=> openEditWeedModal(btn.dataset.id, drawGrid);
    });
  }

  drawGrid();
  const searchEl = $('#w-search');
  if(searchEl) searchEl.oninput = drawGrid;

  main.appendChild(listCard);
}

$('#login-btn').onclick = doLogin;
$('#login-pass').addEventListener('keydown', e=>{ if(e.key === 'Enter') doLogin(); });
$('#login-email').addEventListener('keydown', e=>{ if(e.key === 'Enter') $('#login-pass').focus(); });

(async function init(){
  try{
    const { data } = await supa.auth.getSession();
    if(data && data.session && data.session.user){
      await onLoginSuccess(data.session.user);
    } else {
      $('#loginScreen').style.display = 'flex';
    }
  }catch(e){
    console.error(e);
    $('#loginConnStatus').textContent = 'No se pudo conectar a Supabase. Revisá tu conexión a internet.';
    $('#loginScreen').style.display = 'flex';
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
