<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campamento Guillermo · Manejo Agronómico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6B4C">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NPI - LM">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F3F6F1;
    --surface:#FFFFFF;
    --surface-alt:#EDF1E8;
    --ink:#171E1A;
    --ink-soft:#616B62;
    --ink-faint:#96A092;
    --primary:#1F6B4C;
    --primary-dark:#154B35;
    --primary-soft:#E1EFE6;
    --amber:#C68A2E;
    --amber-soft:#FBF0DC;
    --red:#C1493E;
    --red-soft:#F9E4E1;
    --line:#E3E8DE;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 4px 16px rgba(23,30,26,0.06), 0 1px 3px rgba(23,30,26,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(120deg, rgba(31,107,76,0.05) 0px, rgba(31,107,76,0.05) 1.5px, transparent 1.5px, transparent 30px),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
    min-height:100vh;
  }
  header{
    background:linear-gradient(160deg, var(--primary-dark), var(--primary) 75%);
    color:#fff;
    box-shadow:var(--shadow);
  }
  .header-inner{
    max-width:640px;
    margin:0 auto;
    padding:22px 18px 16px;
    border-radius:0 0 26px 26px;
    position:relative;
  }
  .corp-logo{
    position:absolute;
    top:16px; right:18px;
    height:34px; width:auto;
    opacity:0.92;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.65rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#B9E3CB;
    margin:0 0 4px;
  }
  header h1{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:1.5rem;
    margin:0;
    letter-spacing:-0.3px;
  }
  header p{
    margin:6px 0 0;
    font-size:0.82rem;
    color:#CFE7DC;
  }
  .profile-row{
    margin-top:10px;
    font-size:0.74rem;
    color:#CFE7DC;
    background:rgba(255,255,255,0.12);
    display:inline-block;
    padding:5px 11px;
    border-radius:20px;
  }
  .profile-row button{
    background:none; border:none; color:#fff; text-decoration:underline;
    font-size:0.74rem; cursor:pointer; padding:0; font-family:'Inter',sans-serif;
  }
  main{
    padding:16px 14px 10px;
    max-width:640px;
    margin:0 auto;
  }

  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .card h2{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:1.02rem;
    margin:0 0 12px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  label{
    display:block;
    font-size:0.72rem;
    font-weight:600;
    color:var(--ink-soft);
    margin:11px 0 4px;
  }
  input, select, textarea{
    width:100%;
    padding:10px 11px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    background:var(--surface-alt);
    color:var(--ink);
    transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
  }
  textarea{resize:vertical; min-height:52px;}
  button.primary{
    margin-top:14px;
    width:100%;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:var(--radius-sm);
    font-weight:700;
    font-size:0.9rem;
    font-family:'Sora',sans-serif;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  button.primary:active{background:var(--primary-dark); transform:scale(0.99);}

  .field-error{color:var(--red); font-size:0.74rem; margin-top:6px; display:none;}
  .field-error.show{display:block;}

  /* stock bars */
  .stock-item{padding:12px 2px; border-bottom:1px solid var(--line);}
  .stock-cat-header{
    font-family:'IBM Plex Mono',monospace; font-size:0.68rem; font-weight:600;
    text-transform:uppercase; letter-spacing:0.8px; color:var(--primary);
    margin:16px 0 4px; padding-bottom:4px; border-bottom:1px solid var(--primary-soft);
  }
  .stock-cat-header:first-child{ margin-top:0; }
  .stock-item:last-child{border-bottom:none;}
  .stock-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .stock-head .nombre{font-weight:700; font-size:0.9rem;}
  .cat-edit-x{background:none; border:none; color:var(--ink-faint); font-size:0.75rem; cursor:pointer; padding:0 2px;}
  .stock-sub{font-size:0.7rem; color:var(--ink-faint); margin-top:4px;}
  .app-footer-sig{ text-align:center; padding:18px 0 6px; opacity:0.85; }
  .app-footer-sig img{ height:40px; width:auto; }
  .pv-row{font-size:0.85rem; color:var(--ink); padding:7px 0; border-bottom:1px solid var(--line); text-align:left;}
  .pv-row:last-of-type{border-bottom:none;}
  .pv-row a{color:var(--primary); font-weight:600;}
  .pv-label{display:block; font-size:0.68rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:2px;}
  .stock-num{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:0.92rem; white-space:nowrap;}
  .stock-num .unit{font-size:0.68rem; color:var(--ink-faint); font-weight:500;}
  .bar-track{height:8px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px; transition:width .3s;}
  .bar-fill.ok{background:var(--primary);}
  .bar-fill.low{background:var(--amber);}
  .bar-fill.neg{background:var(--red); width:100% !important;}
  .stock-num.neg{color:var(--red);}

  .empty{
    text-align:center;
    color:var(--ink-faint);
    font-size:0.86rem;
    padding:26px 10px;
  }
  .hist-item{border-bottom:1px solid var(--line); padding:12px 2px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .hist-top .when{font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--ink-faint);}
  .tag{
    display:inline-block; padding:2px 9px; border-radius:20px;
    font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
  }
  .tag.entrada{background:var(--primary-soft); color:var(--primary-dark);}
  .tag.salida{background:var(--red-soft); color:var(--red);}
  .hist-title{font-weight:700; font-size:0.9rem;}
  .hist-detail{font-size:0.79rem; color:var(--ink-soft); margin-top:3px; line-height:1.4;}

  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .toolbar select{background:var(--surface); flex:1;}

  .weed-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .weed-card{border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-alt); border:1px solid var(--line);}
  .weed-card img{width:100%; height:112px; object-fit:cover; display:block;}
  .weed-card .wc-body{padding:8px 9px;}
  .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:4px;}
  .wc-actions{display:flex; gap:2px; flex-shrink:0;}
  .edit-x{background:none; border:none; color:var(--ink-faint); font-size:0.85rem; cursor:pointer; padding:2px 4px;}
  .weed-card .wc-name{font-weight:700; font-size:0.83rem;}
  .weed-card .wc-date{font-size:0.65rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}

  .subtabs{display:flex; gap:8px; margin-bottom:14px;}
  .subtabs button{
    flex:1; padding:10px; border-radius:var(--radius-sm); border:1.5px solid var(--primary);
    background:var(--surface); color:var(--primary); font-weight:700; font-size:0.78rem;
    font-family:'Sora',sans-serif; cursor:pointer; transition:all .15s;
  }
  .subtabs button.active{background:var(--primary); color:#fff;}

  .delete-x{background:none; border:none; color:var(--ink-faint); font-size:1rem; cursor:pointer; padding:2px 6px;}

  .banner{
    font-size:0.75rem; background:var(--amber-soft); border:1px dashed var(--amber);
    padding:10px 12px; border-radius:var(--radius-sm); color:#7A5A1E; margin-bottom:12px;
  }
  .banner-mini{
    font-size:0.72rem; color:var(--ink-faint); background:var(--surface-alt);
    padding:7px 12px; border-radius:20px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .banner-mini button{
    background:none; border:none; color:var(--ink-faint); cursor:pointer;
    font-size:0.8rem; padding:0 2px; flex-shrink:0;
  }

  .savebadge{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:0.72rem; padding:7px 14px; border-radius:20px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:20;
  }
  .savebadge.show{opacity:0.92;}

  nav{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index:15;
  }
  nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; padding:6px 4px; cursor:pointer;
    color:var(--ink-faint); font-family:'Inter',sans-serif; font-size:0.66rem; font-weight:600;
  }
  nav button .ic{font-size:1.15rem; line-height:1;}
  nav button.active{color:var(--primary);}
  nav button.active .ic{
    background:var(--primary-soft); border-radius:10px; padding:3px 12px;
  }

  /* modal propio (reemplaza prompt/confirm/alert, que quedan bloqueados dentro del artifact) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(23,30,26,0.45);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:var(--radius); padding:20px; width:100%; max-width:380px;
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-box h3{font-family:'Sora',sans-serif; font-size:1rem; margin:0 0 8px;}
  .modal-box p{font-size:0.85rem; color:var(--ink-soft); margin:0 0 12px; line-height:1.4;}
  .modal-actions{display:flex; gap:8px; margin-top:14px;}
  .modal-actions button{
    flex:1; padding:10px; border-radius:var(--radius-sm); border:none;
    font-weight:700; font-size:0.85rem; font-family:'Sora',sans-serif; cursor:pointer;
  }
  .modal-actions .btn-cancel{background:var(--surface-alt); color:var(--ink-soft);}
  .modal-actions .btn-ok{background:var(--primary); color:#fff;}
  .modal-actions .btn-danger{background:var(--red); color:#fff;}

  .toast-stack{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px;
  }
  .toast{
    background:var(--ink); color:#fff; font-size:0.82rem; padding:10px 16px; border-radius:var(--radius-sm);
    box-shadow:0 6px 20px rgba(0,0,0,0.2); max-width:420px; text-align:center;
  }
  .toast.err{background:var(--red);}

  /* pantallas grandes: más aire, contenido menos angosto — va al final a propósito, así gana sobre las reglas base */
  @media (min-width: 860px){
    body{ padding-bottom:110px; }
    .header-inner{ max-width:820px; padding:34px 32px 26px; }
    .corp-logo{ top:26px; right:32px; height:42px; }
    header h1{ font-size:1.9rem; }
    header p{ font-size:0.92rem; }
    main{ max-width:820px; padding:28px 24px 40px; }
    .weed-grid{ grid-template-columns:repeat(3, 1fr); }
    nav{
      left:50%; right:auto; transform:translateX(-50%);
      width:calc(100% - 48px); max-width:820px; bottom:20px;
      border-radius:16px; border:1px solid var(--line); box-shadow:var(--shadow);
      background:rgba(255,255,255,0.97);
    }
    nav button{ flex-direction:row; gap:6px; padding:12px; font-size:0.8rem; }
    nav button .ic{ font-size:1rem; }
    .savebadge{ bottom:96px; }
  }

  /* pantalla de login */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg);
  }
  .login-box{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:28px 24px; width:100%; max-width:360px; text-align:center;
  }
  .login-box img{width:64px; height:64px; border-radius:16px; margin-bottom:10px;}
  .login-box h1{font-family:'Sora',sans-serif; font-weight:800; font-size:1.3rem; margin:0 0 2px; color:var(--ink);}
  .login-box p{font-size:0.82rem; color:var(--ink-soft); margin:0 0 18px;}
  .login-box input{margin-bottom:10px;}
  .login-box label{text-align:left;}
  .conn-status{
    font-size:0.68rem; color:var(--ink-faint); margin-top:14px; font-family:'IBM Plex Mono',monospace;
  }
  .logout-btn{
    background:none; border:none; color:#fff; text-decoration:underline;
    font-size:0.74rem; cursor:pointer; padding:0; font-family:'Inter',sans-serif;
  }
  .sync-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px;
    background:#7CD992;
  }
  .sync-dot.off{background:var(--red);}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img src="icon-192.png" alt="logo">
    <h1>NPI - LM</h1>
    <p>Campamento Guillermo · Manejo agronómico</p>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="tu.email@syngenta.com" autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password">
    <div class="field-error" id="login-error"></div>
    <button class="primary" id="login-btn">Ingresar</button>
    <div class="conn-status" id="loginConnStatus"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <header>
    <div class="header-inner">
      <img src="parent-seed-logo.png" alt="Parent Seed · Syngenta" class="corp-logo">
      <p class="eyebrow">Campamento Guillermo</p>
      <h1>Manejo agronómico</h1>
      <p>stock vivo · historial de aplicaciones · biblioteca</p>
      <div class="profile-row" id="profileRow"></div>
    </div>
  </header>

  <main id="main"></main>
  <nav id="nav"></nav>
  <div class="toast-stack" id="toastStack"></div>
</div>

<script>
// ============================================================
// Conexión a Supabase
// ============================================================
const SUPABASE_URL = 'https://aljgksevggwtfndqxoiy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IEGX-ej9_w-tksybzT2Vfw_riE98P7m';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { chemicals: [], movements: [], weeds: [] };
let currentTab = 'stock';
let loadForm = 'entrada';
let currentUser = null;
let autorLabel = '';
let realtimeChannel = null;

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const fmtDate = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const todayISO = () => new Date().toISOString().slice(0,10);

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- toasts ----------
function showToast(msg, isError){
  const stack = $('#toastStack');
  if(!stack) return;
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(), 300); }, 2800);
}

// ---------- modales propios ----------
function askConfirm(title, message, danger){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn-cancel">Cancelar</button>
          <button class="${danger ? 'btn-danger' : 'btn-ok'}">${danger ? 'Eliminar' : 'Confirmar'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.btn-cancel').onclick = ()=>{ overlay.remove(); resolve(false); };
    overlay.querySelector(danger ? '.btn-danger' : '.btn-ok').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}

// ---------- categorías / seed ----------
const CATEGORIAS = ["Herbicida", "Insecticida", "Fungicida", "Fertilizante/Fitorregulador", "Coadyuvante", "Otro"];

const SEED = [
  {nombre:"Banvel (dicamba)", unidad:"L", cantidad:3, categoria:"Herbicida", nota:"Herbicida, Syngenta"},
  {nombre:"Yamato Top", unidad:"L", cantidad:1, categoria:"Herbicida", nota:"Herbicida grupo 15, Summit Agro"},
  {nombre:"Karate (lambdacihalotrina)", unidad:"L", cantidad:1.5, categoria:"Insecticida", nota:"Insecticida grupo 3, Syngenta"},
  {nombre:"Convey", unidad:"L", cantidad:2.5, categoria:"Herbicida", nota:"Herbicida, BASF"},
  {nombre:"DualGold", unidad:"L", cantidad:17, categoria:"Herbicida", nota:"Herbicida grupo 15, Syngenta — dos envases (4L + 13L) sumados"},
  {nombre:"Acuron Uno", unidad:"L", cantidad:2, categoria:"Herbicida", nota:"Herbicida grupo 27, Syngenta"},
  {nombre:"Shutdown", unidad:"L", cantidad:10, categoria:"Herbicida", nota:"Herbicida grupo 14, UPL"},
  {nombre:"Tornado (2,4-D éster)", unidad:"L", cantidad:20, categoria:"Herbicida", nota:"Herbicida grupo 4, UPL"},
  {nombre:"Enlist (2,4-D colina)", unidad:"L", cantidad:25, categoria:"Herbicida", nota:"Herbicida grupo 4, Corteva"},
  {nombre:"Curyom FitUV", unidad:"kg", cantidad:1, categoria:"Insecticida", nota:"Insecticida granulado, Syngenta"},
  {nombre:"Stimulate", unidad:"L", cantidad:1.5, categoria:"Fertilizante/Fitorregulador", nota:"Fitorregulador, Stoller"},
  {nombre:"Ampligo", unidad:"L", cantidad:3, categoria:"Insecticida", nota:"Insecticida grupo 28/3, Syngenta"},
  {nombre:"Callisto", unidad:"L", cantidad:1.5, categoria:"Herbicida", nota:"Herbicida grupo F2, Syngenta"},
  {nombre:"Gesaprim 90 WDG", unidad:"kg", cantidad:10, categoria:"Herbicida", nota:"Herbicida grupo 5 (atrazina), Syngenta"},
  {nombre:"Rizospray Corrector Secuestrante", unidad:"botellas", cantidad:4, categoria:"Coadyuvante", nota:"Coadyuvante, Rizobacter"},
  {nombre:"Sulfosato S Touchdown", unidad:"L", cantidad:30, categoria:"Herbicida", nota:"Herbicida — cantidad aproximada"},
  {nombre:"Liberty", unidad:"L", cantidad:10, categoria:"Herbicida", nota:"Herbicida, BASF — cantidad aproximada"},
  {nombre:"Onduty", unidad:"bolsas", cantidad:3, categoria:"Herbicida", nota:"Herbicida, BASF — 3 bolsas abiertas, contenido parcial (~570g c/u)"},
];

async function seedInitialStock(){
  if(state.chemicals.length > 0){ showToast('Ya hay productos cargados, no hace falta.', true); return; }
  showToast('Cargando stock inicial...');
  for(const item of SEED){
    const { data, error } = await supa.from('chemicals')
      .insert({ nombre:item.nombre, unidad:item.unidad, categoria:item.categoria })
      .select().single();
    if(error){ showToast('Error creando '+item.nombre+': '+error.message, true); continue; }
    await supa.from('movements').insert({
      tipo:'entrada', fecha: todayISO(), chemical_id: data.id, cantidad: item.cantidad,
      notas: 'Carga inicial de stock desde fotos · ' + item.nota, autor: autorLabel
    });
  }
  await fetchAll();
  showToast('Stock inicial cargado ✓');
  render();
}

// ---------- datos: fetch desde Supabase ----------
async function fetchChemicals(){
  const { data, error } = await supa.from('chemicals').select('*').order('nombre');
  if(error){ showToast('Error cargando productos: ' + error.message, true); return; }
  state.chemicals = data || [];
}
async function fetchMovements(){
  const { data, error } = await supa.from('movements').select('*').order('fecha', { ascending:true });
  if(error){ showToast('Error cargando movimientos: ' + error.message, true); return; }
  state.movements = (data || []).map(m => ({
    id: m.id, tipo: m.tipo, fecha: m.fecha, chemicalId: m.chemical_id,
    cantidad: m.cantidad, proveedor: m.proveedor, factura: m.factura,
    labor: m.labor, lote: m.lote, supAplicada: m.sup_aplicada, dosis: m.dosis,
    consumo: m.consumo, foto: m.foto_url, notas: m.notas, autor: m.autor
  }));
}
async function fetchWeeds(){
  const { data, error } = await supa.from('weeds').select('*').order('fecha', { ascending:false });
  if(error){ showToast('Error cargando biblioteca: ' + error.message, true); return; }
  state.weeds = (data || []).map(w => ({
    id: w.id, nombre: w.nombre, fecha: w.fecha, foto: w.foto_url, notas: w.notas, autor: w.autor
  }));
}
async function fetchAll(){ await Promise.all([fetchChemicals(), fetchMovements(), fetchWeeds()]); }

function stockOf(chemicalId){
  let total = 0;
  state.movements.forEach(m=>{
    if(m.tipo === 'entrada' && m.chemicalId === chemicalId) total += num(m.cantidad);
    if(m.tipo === 'salida' && m.chemicalId === chemicalId) total -= num(m.consumo);
  });
  return total;
}
function maxEntradaOf(chemicalId){
  let max = 0;
  state.movements.forEach(m=>{
    if(m.tipo === 'entrada' && m.chemicalId === chemicalId) max = Math.max(max, num(m.cantidad));
  });
  return max || 1;
}
function chemicalName(id){ const c = state.chemicals.find(c=>c.id===id); return c ? c.nombre : '(producto eliminado)'; }
function chemicalUnit(id){ const c = state.chemicals.find(c=>c.id===id); return c ? c.unidad : ''; }
function chemicalCategoria(id){ const c = state.chemicals.find(c=>c.id===id); return (c && c.categoria) ? c.categoria : 'Otro'; }

// ---------- fotos ----------
async function uploadPhoto(file, folder){
  if(!file) return '';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supa.storage.from('fotos').upload(path, file, { cacheControl:'3600', upsert:false });
    if(error){ showToast('No se pudo subir la foto: ' + error.message, true); return ''; }
    const { data } = supa.storage.from('fotos').getPublicUrl(path);
    return (data && data.publicUrl) ? data.publicUrl : '';
  }catch(e){
    showToast('No se pudo subir la foto.', true);
    return '';
  }
}

// ---------- autenticación ----------
async function doLogin(){
  const email = $('#login-email').value.trim();
  const pass = $('#login-pass').value;
  const errEl = $('#login-error');
  errEl.classList.remove('show'); errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Completá email y contraseña.'; errEl.classList.add('show'); return; }
  const btn = $('#login-btn');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Ingresar';
  if(error){
    errEl.textContent = 'No se pudo ingresar: revisá el email y la contraseña.';
    errEl.classList.add('show');
    return;
  }
  await onLoginSuccess(data.user);
}

async function onLoginSuccess(user){
  currentUser = user;
  autorLabel = (user.email || '').split('@')[0];
  $('#loginScreen').style.display = 'none';
  $('#appRoot').style.display = 'block';
  renderProfileBadge();
  await fetchAll();
  render();
  setupRealtime();
}

async function doLogout(){
  if(realtimeChannel){ supa.removeChannel(realtimeChannel); realtimeChannel = null; }
  await supa.auth.signOut();
  currentUser = null;
  state = { chemicals: [], movements: [], weeds: [] };
  $('#appRoot').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
  $('#login-email').value = '';
  $('#login-pass').value = '';
}

function renderProfileBadge(){
  const el = $('#profileRow');
  if(!el) return;
  el.innerHTML = `<span class="sync-dot" id="syncDot"></span>${escapeHtml(currentUser ? currentUser.email : '')} · <button id="logoutBtn" class="logout-btn">salir</button>`;
  const btn = $('#logoutBtn');
  if(btn) btn.onclick = doLogout;
}

function setupRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supa.channel('public:campamento-guillermo')
    .on('postgres_changes', { event:'*', schema:'public', table:'chemicals' }, async ()=>{ await fetchChemicals(); render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'movements' }, async ()=>{ await fetchMovements(); render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'weeds' }, async ()=>{ await fetchWeeds(); render(); })
    .subscribe((status)=>{
      const dot = $('#syncDot');
      if(dot) dot.classList.toggle('off', status !== 'SUBSCRIBED');
    });
}

// ---------- exportación a Excel ----------
function xlsxReady(){
  if(typeof XLSX === 'undefined'){
    showToast('No se pudo cargar la librería de Excel. Revisá tu conexión a internet e intentá de nuevo.', true);
    return false;
  }
  return true;
}

function exportStockExcel(){
  if(!xlsxReady()) return;
  const stockRows = state.chemicals.slice()
    .sort((a,b)=> (a.categoria||'Otro').localeCompare(b.categoria||'Otro') || a.nombre.localeCompare(b.nombre))
    .map(c=>({
      "Producto": c.nombre, "Categoría": c.categoria || 'Otro', "Unidad": c.unidad,
      "Stock actual": Number(stockOf(c.id).toFixed(2))
    }));
  const comprasRows = state.movements.filter(m=>m.tipo==='entrada')
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(m=>({
      "Fecha": m.fecha, "Producto": chemicalName(m.chemicalId), "Categoría": chemicalCategoria(m.chemicalId),
      "Cantidad": m.cantidad, "Unidad": chemicalUnit(m.chemicalId), "Proveedor": m.proveedor || '',
      "N° factura/remito": m.factura || '', "Cargado por": m.autor || '', "Notas": m.notas || ''
    }));
  const salidasRows = state.movements.filter(m=>m.tipo==='salida')
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .map(m=>({
      "Fecha": m.fecha, "Labor": m.labor, "Lote/sector": m.lote || '', "Superficie (ha)": m.supAplicada,
      "Producto": chemicalName(m.chemicalId), "Dosis/ha": m.dosis, "Unidad": chemicalUnit(m.chemicalId),
      "Consumo total": Number((m.consumo||0).toFixed(2)), "Cargado por": m.autor || '', "Notas": m.notas || '',
      "Tiene foto": m.foto ? 'Sí' : 'No'
    }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows), 'Stock actual');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(comprasRows), 'Compras');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salidasRows), 'Aplicaciones');
  XLSX.writeFile(wb, `stock_y_movimientos_campamento_guillermo_${todayISO()}.xlsx`);
  showToast('Descarga generada ✓');
}

function exportHistorialExcel(){
  if(!xlsxReady()) return;
  const rows = state.movements.filter(m=>m.tipo==='salida')
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))

// ---------- STOCK ----------
function renderStock(main){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>🧪 Stock vivo de químicos</h2>`;
  if(state.chemicals.length === 0){
    card.innerHTML += `<div class="empty">Todavía no hay productos cargados.<br>Andá a "Cargar → Entrada" para registrar la primera compra.</div>`;
    const seedBtn = document.createElement('button');
    seedBtn.className = 'primary';
    seedBtn.textContent = '📦 Cargar stock inicial (18 productos de las fotos)';
    seedBtn.onclick = seedInitialStock;
    card.appendChild(seedBtn);
  } else {
    const groups = {};
    state.chemicals.forEach(c=>{
      const cat = c.categoria || 'Otro';
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push(c);
    });
    CATEGORIAS.forEach(cat=>{
      if(!groups[cat] || groups[cat].length === 0) return;
      const catHeader = document.createElement('div');
      catHeader.className = 'stock-cat-header';
      catHeader.textContent = cat;
      card.appendChild(catHeader);
      groups[cat].slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(c=>{
        const s = stockOf(c.id);
        const max = Math.max(maxEntradaOf(c.id), s);
        const frac = max > 0 ? Math.min(1, Math.max(0, s/max)) : 0;
        const barClass = s < 0 ? 'neg' : (frac < 0.25 ? 'low' : 'ok');
        const div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML = `
          <div class="stock-head">
            <span class="nombre">${escapeHtml(c.nombre)} <button class="cat-edit-x" data-id="${c.id}" title="Ver ficha técnica">ℹ️</button><button class="cat-edit-x edit-chem-x" data-id="${c.id}" title="Editar ficha técnica">✏️</button></span>
            <span class="stock-num ${s<0?'neg':''}">${s.toFixed(2)} <span class="unit">${escapeHtml(c.unidad)}</span></span>
          </div>
          <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${Math.round(frac*100)}%"></div></div>
          ${c.cultivo ? `<div class="stock-sub">🌱 ${escapeHtml(c.cultivo)}</div>` : ''}
        `;
        card.appendChild(div);
      });
    });
    $$('.cat-edit-x:not(.edit-chem-x)', card).forEach(btn=>{
      btn.onclick = ()=> openProductViewModal(btn.dataset.id);
    });
    $$('.edit-chem-x', card).forEach(btn=>{
      btn.onclick = ()=> openProductEditModal(btn.dataset.id);
    });
  }
  main.appendChild(card);

  const entradas = state.movements.filter(m=>m.tipo==='entrada').length;
  const salidas = state.movements.filter(m=>m.tipo==='salida').length;
  const info = document.createElement('div');
  info.className = 'card';
  info.innerHTML = `<h2>📊 Resumen</h2>
    <div class="hist-detail">Compras registradas: <b>${entradas}</b></div>
    <div class="hist-detail">Aplicaciones / labores registradas: <b>${salidas}</b></div>
    <div class="hist-detail">Fichas en biblioteca de malezas: <b>${state.weeds.length}</b></div>
    <button class="primary" id="export-stock-btn">📥 Descargar stock y movimientos (Excel)</button>`;
  main.appendChild(info);
  $('#export-stock-btn').onclick = exportStockExcel;

  const purchCard = document.createElement('div');
  purchCard.className = 'card';
  purchCard.innerHTML = '<h2>🧾 Registro de compras</h2>';
  const purchList = document.createElement('div');
  purchCard.appendChild(purchList);
  main.appendChild(purchCard);

  const compras = state.movements.filter(m=>m.tipo==='entrada').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(compras.length === 0){
    purchList.innerHTML = '<div class="empty">Todavía no hay compras.</div>';
  } else {
    compras.forEach(m=>{
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = `
        <div class="hist-top">
          <span><span class="tag entrada">Compra</span> <span class="when">${fmtDate(m.fecha)}</span></span>
          <button class="delete-x" data-id="${m.id}">✕</button>
        </div>
        <div class="hist-title">${escapeHtml(chemicalName(m.chemicalId))} · +${m.cantidad} ${escapeHtml(chemicalUnit(m.chemicalId))}</div>
        <div class="hist-detail">${m.proveedor ? 'Proveedor: '+escapeHtml(m.proveedor)+' · ' : ''}${m.factura ? 'Comp.: '+escapeHtml(m.factura) : ''}</div>
        ${m.notas ? `<div class="hist-detail">${escapeHtml(m.notas)}</div>` : ''}
        ${m.autor ? `<div class="hist-detail">Cargado por: ${escapeHtml(m.autor)}</div>` : ''}
      `;
      purchList.appendChild(div);
    });
    $$('.delete-x', purchList).forEach(btn=>{
      btn.onclick = async ()=>{
        const ok = await askConfirm('Eliminar compra', '¿Eliminar esta compra? Esto va a recalcular el stock.', true);
        if(ok){
          const { error } = await supa.from('movements').delete().eq('id', btn.dataset.id);
          if(error){ showToast('Error: '+error.message, true); return; }
          await fetchMovements();
          render();
        }
      };
    });
  }
}

      <label>Link a marbete / etiqueta (opcional)</label>
      <input id="e-newchem-marbete" placeholder="https://...">
      <div class="hist-detail" style="margin:6px 0 0;">Si no tenés estos datos a mano ahora, dejalos en blanco — después los podés completar tocando el ℹ️ del producto en Stock.</div>
    </div>
    <label>Fecha</label>
    <input type="date" id="e-fecha">
    <label>Cantidad comprada</label>
    <input type="number" step="0.01" id="e-cantidad" placeholder="0.00">
    <label>Proveedor (opcional)</label>
    <input id="e-proveedor" placeholder="Ej: Coop. Agrícola">
    <label>N° factura / remito (opcional)</label>
    <input id="e-factura">
    <label>Notas (opcional)</label>
    <textarea id="e-notas"></textarea>
    <div class="field-error" id="e-error"></div>
    <button class="primary" id="e-save">Guardar entrada</button>
  `;
  main.appendChild(card);
  $('#e-fecha').value = todayISO();
  $('#e-chem').onchange = (e)=>{ $('#e-newchem-wrap').style.display = e.target.value === '__new__' ? 'block' : 'none'; };

  function showErr(msg){ const el = $('#e-error'); el.textContent = msg; el.classList.add('show'); }
  function clearErr(){ const el = $('#e-error'); el.textContent=''; el.classList.remove('show'); }

  $('#e-save').onclick = async ()=>{
    clearErr();
    const btn = $('#e-save'); btn.disabled = true;
    let chemId = $('#e-chem').value;
    if(chemId === '__new__'){
      const name = $('#e-newchem-name').value.trim();
      const unit = $('#e-newchem-unit').value.trim();
      const categoria = $('#e-newchem-cat').value;
      const cultivo = $('#e-newchem-cultivo').value || null;
      const ingrediente_activo = $('#e-newchem-ia').value.trim() || null;
      const grupo = $('#e-newchem-grupo').value.trim() || null;
      const consideraciones = $('#e-newchem-consid').value.trim() || null;
      const ficha_url = $('#e-newchem-url').value.trim() || null;
      const marbete_url = $('#e-newchem-marbete').value.trim() || null;
      if(!name){ showErr('Poné un nombre para el nuevo producto.'); btn.disabled=false; return; }
      const { data, error } = await supa.from('chemicals')
        .insert({ nombre:name, unidad: unit || 'unidades', categoria, cultivo, ingrediente_activo, grupo, consideraciones, ficha_url, marbete_url })
        .select().single();
      if(error){ showErr('Error creando el producto: ' + error.message); btn.disabled=false; return; }
      chemId = data.id;
    }
    const cantidad = num($('#e-cantidad').value);
    if(cantidad <= 0){ showErr('La cantidad debe ser mayor a 0.'); btn.disabled=false; return; }
    const fecha = $('#e-fecha').value;
    if(!fecha){ showErr('Poné la fecha.'); btn.disabled=false; return; }
    const { error } = await supa.from('movements').insert({
      tipo:'entrada', fecha, chemical_id: chemId, cantidad,
      proveedor: $('#e-proveedor').value.trim(), factura: $('#e-factura').value.trim(),
      notas: $('#e-notas').value.trim(), autor: autorLabel
    });
    btn.disabled = false;
    if(error){ showErr('Error guardando: ' + error.message); return; }
    await fetchAll();
    showToast('Compra guardada ✓');
    render();
  };
}

    if(error){ showErr('Error guardando: ' + error.message); return; }
    await fetchAll();
    showToast('Labor guardada ✓');
    render();
  };

function renderHistorial(main){
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <select id="h-labor">
      <option value="">Toda labor</option>
      <option>Herbicida</option>
      <option>Fungicida</option>
      <option>Insecticida</option>
      <option>Fertilización</option>
      <option>Labranza</option>
      <option>Siembra</option>
      <option>Otra</option>
    </select>
    <select id="h-chem">
      <option value="">Todos los productos</option>
      ${chemOptionsHTML()}
    </select>
  `;
  main.appendChild(toolbar);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>📋 Historial de manejo</h2>
    <button class="primary" id="export-hist-btn" style="margin-bottom:14px;">📥 Descargar historial de manejo (Excel)</button>`;
  const list = document.createElement('div');
  card.appendChild(list);
  main.appendChild(card);
  $('#export-hist-btn').onclick = exportHistorialExcel;

  function draw(){
    const labor = $('#h-labor').value;
    const chem = $('#h-chem').value;
    let items = state.movements.filter(m=>{
      if(m.tipo !== 'salida') return false;
      if(labor && m.labor !== labor) return false;
      if(chem && m.chemicalId !== chem) return false;
      return true;
    }).sort((a,b)=> b.fecha.localeCompare(a.fecha));

    list.innerHTML = '';
    if(items.length === 0){ list.innerHTML = '<div class="empty">Todavía no hay labores registradas que coincidan.</div>'; return; }
    items.forEach(m=>{
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = `
        <div class="hist-top">
          <span><span class="tag salida">${escapeHtml(m.labor)}</span> <span class="when">${fmtDate(m.fecha)}</span></span>
          <button class="delete-x" data-id="${m.id}">✕</button>
        </div>
        <div class="hist-title">${escapeHtml(m.lote || '(sin lote)')} · ${m.supAplicada} ha</div>
        <div class="hist-detail">${escapeHtml(chemicalName(m.chemicalId))} · dosis ${m.dosis} ${escapeHtml(chemicalUnit(m.chemicalId))}/ha · consumo total ${m.consumo.toFixed(2)} ${escapeHtml(chemicalUnit(m.chemicalId))}</div>
        ${m.notas ? `<div class="hist-detail">${escapeHtml(m.notas)}</div>` : ''}
        ${m.autor ? `<div class="hist-detail">Cargado por: ${escapeHtml(m.autor)}</div>` : ''}
        ${m.foto ? `<img src="${m.foto}" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-sm);margin-top:8px;">` : ''}
      `;
      list.appendChild(div);
    });

    $$('.delete-x', list).forEach(btn=>{
      btn.onclick = async ()=>{
        const ok = await askConfirm('Eliminar labor', '¿Eliminar esta labor? Esto va a recalcular el stock.', true);
        if(ok){
          const { error } = await supa.from('movements').delete().eq('id', btn.dataset.id);
          if(error){ showToast('Error: '+error.message, true); return; }
          await fetchMovements();
          draw();
        }
      };
    });
  }
  $('#h-labor').onchange = draw;
  $('#h-chem').onchange = draw;
  draw();
}

function openEditWeedModal(weedId, onDone){
  const w = state.weeds.find(x=>x.id===weedId);
  if(!w) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Editar ficha</h3>
      <label>Nombre</label>
      <input type="text" id="editw-nombre" value="${escapeHtml(w.nombre)}">
      <label>Foto actual</label>
      ${w.foto
        ? `<img src="${w.foto}" style="width:100%;max-height:160px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:8px;">`
        : `<div style="font-size:0.78rem;color:var(--ink-faint);margin-bottom:8px;">Todavía no tiene foto.</div>`}
      <label>${w.foto ? 'Reemplazar foto (opcional)' : 'Agregar foto (opcional)'}</label>
      <input type="file" id="editw-foto" accept="image/*">
      <label>Notas</label>
      <textarea id="editw-notas">${escapeHtml(w.notas)}</textarea>
      <div class="modal-actions">
        <button class="btn-cancel">Cancelar</button>
        <button class="btn-ok">Guardar cambios</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.btn-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('.btn-ok').onclick = async ()=>{
    const nombre = overlay.querySelector('#editw-nombre').value.trim();
    const notas = overlay.querySelector('#editw-notas').value.trim();
    const file = overlay.querySelector('#editw-foto').files[0];
    if(!nombre){ showToast('Poné un nombre.', true); return; }
    const okBtn = overlay.querySelector('.btn-ok'); okBtn.disabled = true;
    const fotoUrl = await uploadPhoto(file, 'malezas');
    const updateObj = { nombre, notas };
    if(fotoUrl) updateObj.foto_url = fotoUrl;
    const { error } = await supa.from('weeds').update(updateObj).eq('id', weedId);
    okBtn.disabled = false;
    if(error){ showToast('Error: '+error.message, true); return; }
    await fetchWeeds();
    showToast('Ficha actualizada ✓');
    overlay.remove();
    if(onDone) onDone(); else render();
  };
}

async function migrateLocalWeeds(){
  let raw = null;
  try{ raw = localStorage.getItem('campamento-guillermo-agro-v1'); }catch(e){}
  if(!raw){ showToast('No se encontraron datos guardados en este navegador.', true); return; }
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ showToast('Los datos locales de este navegador no se pudieron leer.', true); return; }
  const weeds = (parsed && Array.isArray(parsed.weeds)) ? parsed.weeds : [];
  if(weeds.length === 0){ showToast('No había fichas de biblioteca guardadas en este navegador.', true); return; }
  const conFoto = weeds.filter(w=>w.foto).length;
  const ok = await askConfirm(
    'Recuperar fichas de este navegador',
    `Se encontraron ${weeds.length} fichas guardadas acá (${conFoto} con foto). ¿Migrarlas a la base compartida de Supabase?`,
    false
  );
  if(!ok) return;
  showToast('Migrando fichas, puede tardar un poco...');
  let count = 0;
  for(const w of weeds){
    let fotoUrl = '';
    if(w.foto && typeof w.foto === 'string' && w.foto.startsWith('data:')){
      try{
        const blob = await (await fetch(w.foto)).blob();
        const ext = (blob.type.split('/')[1] || 'jpg').replace(/[^a-z0-9]/g,'') || 'jpg';
        const path = `malezas/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        const { error: upErr } = await supa.storage.from('fotos').upload(path, blob, { cacheControl:'3600', upsert:false });
        if(!upErr){
          const { data } = supa.storage.from('fotos').getPublicUrl(path);
          fotoUrl = (data && data.publicUrl) ? data.publicUrl : '';
        }
      }catch(e){ /* si falla la foto, igual migramos el texto de la ficha */ }
    }
    const { error } = await supa.from('weeds').insert({
      nombre: w.nombre || 'Sin nombre', fecha: w.fecha || todayISO(),
      foto_url: fotoUrl || null, notas: w.notas || '', autor: autorLabel
    });
    if(!error) count++;
  }
  await fetchWeeds();
  showToast(`${count} de ${weeds.length} fichas migradas ✓`);
  render();
}

function renderBiblioteca(main){
  const migrateCard = document.createElement('div');
  migrateCard.className = 'card';
  migrateCard.innerHTML = `
    <h2>♻️ Recuperar fichas de este navegador</h2>
    <div class="hist-detail" style="margin-bottom:8px;">Si en este mismo navegador ya habías cargado fichas con fotos antes de pasar a Supabase, tocá este botón para subirlas a la base compartida. Solo hace falta hacerlo una vez por dispositivo.</div>
    <button class="primary" id="migrate-local-btn">Buscar y migrar fichas de este navegador</button>
  `;
  main.appendChild(migrateCard);
  $('#migrate-local-btn').onclick = migrateLocalWeeds;

  const importCard = document.createElement('div');
  importCard.className = 'card';
  importCard.innerHTML = `
    <h2>📥 Importar base de consulta</h2>
    <div class="hist-detail" style="margin-bottom:8px;">Cargá un archivo .json con fichas (nombre + notas) y se agregan todas juntas a la biblioteca. Después les podés sumar fotos entrando a cada una manualmente si querés.</div>
    <input type="file" id="w-import" accept=".json,application/json">
    <div class="field-error" id="w-import-error"></div>
    <button class="primary" id="w-import-btn">Importar</button>
  `;
  main.appendChild(importCard);

  function showImportErr(msg){ const el = $('#w-import-error'); el.textContent = msg; el.classList.add('show'); }
  function clearImportErr(){ const el = $('#w-import-error'); el.textContent=''; el.classList.remove('show'); }

  $('#w-import-btn').onclick = ()=>{
    clearImportErr();
    const file = $('#w-import').files[0];
    if(!file){ showImportErr('Elegí primero un archivo .json.'); return; }
    const reader = new FileReader();
    reader.onload = async ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ showImportErr('El archivo no es un JSON válido.'); return; }
      if(!Array.isArray(data)){ showImportErr('El JSON debe ser una lista de fichas.'); return; }
      const rows = data.filter(item => item && typeof item.nombre === 'string' && item.nombre.trim())
        .map(item => ({
          nombre: item.nombre.trim(), fecha: todayISO(),
          notas: (item.notas || '').trim(), autor: autorLabel
        }));
      if(rows.length === 0){ showImportErr('No se encontraron fichas válidas en el archivo.'); return; }
      const { error } = await supa.from('weeds').insert(rows);
      if(error){ showImportErr('Error importando: ' + error.message); return; }
      await fetchWeeds();
      showToast(`${rows.length} fichas importadas ✓`);
      render();
    };
    reader.onerror = ()=> showImportErr('No se pudo leer el archivo.');
    reader.readAsText(file);
  };

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>🌿 Cargar ficha de maleza / consulta</h2>
    <label>Nombre</label>
    <input id="w-nombre" placeholder="Ej: Rama negra (Conyza spp.)">
    <label>Foto (opcional)</label>
    <input type="file" id="w-foto" accept="image/*">
    <label>Notas (control, estado, observaciones)</label>
    <textarea id="w-notas"></textarea>
    <div class="field-error" id="w-error"></div>
    <button class="primary" id="w-save">Guardar ficha</button>
  `;
  main.appendChild(card);

  function showErr(msg){ const el = $('#w-error'); el.textContent = msg; el.classList.add('show'); }
  function clearErr(){ const el = $('#w-error'); el.textContent=''; el.classList.remove('show'); }

  $('#w-save').onclick = async ()=>{
    clearErr();
    const nombre = $('#w-nombre').value.trim();
    if(!nombre){ showErr('Poné un nombre.'); return; }
    const btn = $('#w-save'); btn.disabled = true; btn.textContent = 'Guardando...';
    const file = $('#w-foto').files[0];
    const fotoUrl = await uploadPhoto(file, 'malezas');
    const { error } = await supa.from('weeds').insert({
      nombre, fecha: todayISO(), foto_url: fotoUrl || null, notas: $('#w-notas').value.trim(), autor: autorLabel
    });
    btn.disabled = false; btn.textContent = 'Guardar ficha';
    if(error){ showErr('Error guardando: ' + error.message); return; }
    await fetchWeeds();
    showToast('Ficha guardada ✓');
    render();
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.innerHTML = '<h2>Biblioteca</h2>';
  if(state.weeds.length > 0){
    const searchWrap = document.createElement('div');
    searchWrap.innerHTML = `<input type="text" id="w-search" placeholder="Buscar por nombre o notas...">`;
    listCard.appendChild(searchWrap);
  }
  const gridContainer = document.createElement('div');
  listCard.appendChild(gridContainer);

  function normalize(str){
    return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function drawGrid(){
    if(state.weeds.length === 0){
      gridContainer.innerHTML = '<div class="empty">Todavía no hay fichas cargadas.</div>';
      return;
    }
    const searchEl = $('#w-search');
    const q = normalize(searchEl ? searchEl.value : '');
    const filtered = state.weeds.filter(w => !q || normalize(w.nombre).includes(q) || normalize(w.notas).includes(q));
    gridContainer.innerHTML = '';
    if(filtered.length === 0){
      gridContainer.innerHTML = '<div class="empty">No hay fichas que coincidan con la búsqueda.</div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'weed-grid';
    filtered.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(w=>{
      const div = document.createElement('div');
      div.className = 'weed-card';
      div.innerHTML = `
        ${w.foto ? `<img src="${w.foto}" alt="${escapeHtml(w.nombre)}">` : `<div style="height:112px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:0.7rem;">sin foto</div>`}
        <div class="wc-body">
          <div class="wc-top">
            <div class="wc-name">${escapeHtml(w.nombre)}</div>
            <div class="wc-actions">
              <button class="edit-x" data-id="${w.id}" title="Editar">✏️</button>
              <button class="delete-x" data-id="${w.id}">✕</button>
            </div>
          </div>
          <div class="wc-date">${fmtDate(w.fecha)}</div>
          ${w.notas ? `<div class="hist-detail">${escapeHtml(w.notas)}</div>` : ''}
        </div>
      `;
      grid.appendChild(div);
    });
    gridContainer.appendChild(grid);
    $$('.delete-x', grid).forEach(btn=>{
      btn.onclick = async ()=>{
        const ok = await askConfirm('Eliminar ficha', '¿Eliminar esta ficha de la biblioteca?', true);
        if(ok){
          const { error } = await supa.from('weeds').delete().eq('id', btn.dataset.id);
          if(error){ showToast('Error: '+error.message, true); return; }
          await fetchWeeds();
          drawGrid();
        }
      };
    });
    $$('.edit-x', grid).forEach(btn=>{
      btn.onclick = ()=> openEditWeedModal(btn.dataset.id, drawGrid);
    });
  }

  drawGrid();
  const searchEl = $('#w-search');
  if(searchEl) searchEl.oninput = drawGrid;

  main.appendChild(listCard);
}
